# Render Blueprint — LegalM Compliance Platform
# Deploys all services in one click.
# Dashboard → New → Blueprint → connect repo → Apply
#
# Free tier limitations addressed:
#   - No worker service type  → Celery runs inside the backend container via a
#                               startup script that launches both uvicorn and
#                               the Celery worker as background processes.
#   - No persistent disks     → UPLOAD_DIR uses /tmp (ephemeral; fine for demo)
#   - No shell access         → migrations run via preDeployCommand

databases:
  - name: legalm-db
    databaseName: legalm
    user: legalm
    plan: free
    region: singapore
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all

services:
  # ── Managed Redis ──────────────────────────────────────────────────────────
  - type: redis
    name: legalm-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all

  # ── Backend + Worker (combined, free-tier compatible) ──────────────────────
  # The start.sh script launches the Celery worker in the background first,
  # then starts uvicorn in the foreground. Both share the same process space,
  # same env vars, and same /tmp/uploads directory.
  - type: web
    name: legalm-backend
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Run migrations before each deploy, then start combined server+worker
    preDeployCommand: alembic upgrade head
    dockerCommand: >
      sh -c "celery -A app.services.pipeline_service.celery_app worker
      --loglevel=info --concurrency=1 --detach &&
      uvicorn main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: APP_NAME
        value: Legal Metrology Compliance API
      - key: APP_VERSION
        value: "1.0.0"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: UPLOAD_DIR
        value: /tmp/uploads

      - key: DATABASE_URL
        fromDatabase:
          name: legalm-db
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          name: legalm-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: legalm-redis
          type: redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      # Paste your Groq API key in the Render dashboard after first deploy:
      # legalm-backend → Environment → GROQ_API_KEY
      - key: GROQ_API_KEY
        sync: false

      # Update this after legalm-web is deployed with its actual URL
      - key: CORS_ORIGINS
        value: https://legalm-web.onrender.com

  # ── Next.js Web Dashboard ──────────────────────────────────────────────────
  - type: web
    name: legalm-web
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # After legalm-backend deploys, copy its URL and set it here,
      # then click "Manual Deploy" on legalm-web.
      # e.g. https://legalm-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false

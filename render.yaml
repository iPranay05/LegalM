# Render Blueprint — LegalM Compliance Platform
# Deploys all services in one click from the Render dashboard.
# Dashboard → New → Blueprint → connect repo → this file is auto-detected.
#
# Services deployed:
#   1. legalm-db       — managed PostgreSQL 16 database
#   2. legalm-redis    — managed Redis (Celery broker + result backend)
#   3. legalm-backend  — FastAPI app (Docker)
#   4. legalm-worker   — Celery background worker (Docker)
#   5. legalm-web      — Next.js dashboard (Docker)

databases:
  - name: legalm-db
    databaseName: legalm
    user: legalm
    plan: free
    region: singapore
    # Free tier requires an explicit IP allow list.
    # 0.0.0.0/0 allows all — sufficient for internal Render service connections.
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all (Render internal + external)

services:
  # ── Managed Redis ──────────────────────────────────────────────────────────
  - type: redis
    name: legalm-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: legalm-backend
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # NOTE: Disks are not available on the free tier.
    # Uploaded images and reports will be stored in /tmp (ephemeral).
    # They will be lost on redeploy — acceptable for demo/hackathon use.
    # Upgrade to the Starter plan ($7/mo) and re-add the disk block to persist files.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: APP_NAME
        value: Legal Metrology Compliance API
      - key: APP_VERSION
        value: "1.0.0"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: UPLOAD_DIR
        value: /tmp/uploads

      - key: DATABASE_URL
        fromDatabase:
          name: legalm-db
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          name: legalm-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: legalm-redis
          type: redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: GROQ_API_KEY
        sync: false

      - key: CORS_ORIGINS
        value: https://legalm-web.onrender.com

  # ── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: legalm-worker
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.services.pipeline_service.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: ALGORITHM
        value: HS256

      - key: DATABASE_URL
        fromDatabase:
          name: legalm-db
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          name: legalm-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: legalm-redis
          type: redis
          property: connectionString

      - key: SECRET_KEY
        fromService:
          name: legalm-backend
          type: web
          envVarKey: SECRET_KEY

      - key: GROQ_API_KEY
        fromService:
          name: legalm-backend
          type: web
          envVarKey: GROQ_API_KEY

  # ── Next.js Web Dashboard ──────────────────────────────────────────────────
  - type: web
    name: legalm-web
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Set this manually after legalm-backend is deployed:
      #   1. Copy the backend URL e.g. https://legalm-backend.onrender.com
      #   2. Paste it here in the Render dashboard → legalm-web → Environment
      #   3. Trigger a manual redeploy of legalm-web
      - key: NEXT_PUBLIC_API_URL
        sync: false

services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legalm}
      POSTGRES_USER: ${POSTGRES_USER:-legalm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalm_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: celery -A app.services.pipeline_service.celery_app worker --loglevel=info
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports

volumes:
  postgres_data:
